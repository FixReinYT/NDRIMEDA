services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ndrimeda
      POSTGRES_USER: ndrimeda
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-dev-change-me}
    volumes:
      - ndrimeda_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ndrimeda -d ndrimeda"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://ndrimeda:${POSTGRES_PASSWORD:-local-dev-change-me}@db:5432/ndrimeda
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-this-secret-before-deployment}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
volumes:
  ndrimeda_data:
