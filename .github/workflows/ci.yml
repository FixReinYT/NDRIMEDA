name: Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check backend Python syntax
        run: python -m compileall -q backend
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build APK
        run: gradle :app:assembleDebug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ndrimeda-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publish direct APK download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: beta-${{ github.run_number }}
          name: NDRIMEDA Public Beta ${{ github.run_number }}
          body: |
            Public beta build of NDRIMEDA.
            This is a debug APK for testing, not a Google Play release.
            Offline entry and local chat history work without a server.
            The Network tab supports direct text messages between accounts on the same configured HTTPS relay.
            Cross-node federation and end-to-end encryption are not implemented; do not send sensitive data.
          files: app/build/outputs/apk/debug/app-debug.apk
          prerelease: true
          make_latest: false
